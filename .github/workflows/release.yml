# Publish to PyPI when a version tag is pushed:
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# Uses PyPI Trusted Publishing (OpenID Connect): PyPI trusts this workflow
# in this repository, so no API token is stored anywhere. One-time setup on
# pypi.org -> project "bewit" -> Settings -> Publishing -> add a GitHub
# publisher: owner CodeDD-ai, repository bewit, workflow release.yml,
# environment pypi.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          module=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/bewit/__init__.py)
          echo "tag=$tag pyproject=$project __version__=$module"
          [ "$tag" = "$project" ] && [ "$tag" = "$module" ] || {
            echo "::error::Tag v$tag does not match pyproject.toml ($project) and src/bewit/__init__.py ($module)"
            exit 1
          }
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Protect this environment in GitHub (Settings -> Environments -> pypi)
    # with required reviewers so a release needs a human click.
    environment:
      name: pypi
      url: https://pypi.org/project/bewit/
    permissions:
      id-token: write # the OIDC identity PyPI trusts; no token secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
