# Rules for the ArchRev repository itself (dogfooding).

# --- Path rules -----------------------------------------------------------

- id: flag-audit-format
  kind: path
  match: ["src/archrev/storage.py", "src/archrev/gitutil.py"]
  action: flag
  message: >-
    This file defines the on-disk audit format / git linkage. Changes must
    stay backward-compatible with existing session records.

- id: flag-enforcement-core
  kind: path
  match: ["src/archrev/gate.py", "src/archrev/hooks.py", "src/archrev/config.py"]
  action: flag
  message: >-
    Enforcement-core change (gate semantics, hook fail-open behavior,
    exemptions). Requires regression tests in tests/test_gate.py or
    tests/test_hooks.py.

- id: block-packaging
  kind: path
  match: ["pyproject.toml"]
  action: block
  message: "Packaging/dependency changes require explicit approval."

- id: block-license
  kind: path
  match: ["LICENSE"]
  action: block
  message: "License changes require explicit approval."

# --- Check rules (quality gates over changed files) -------------------------

- id: check-python-syntax
  kind: check
  match: ["src/**/*.py", "tests/**/*.py"]
  command: python -m py_compile {files}
  action: block
  message: "Changed Python files must compile (py_compile)."

# --- Prompt rules (attested via `archrev check plan`) -----------------------

- id: hooks-fail-open
  kind: prompt
  policy: >-
    Any change to hook handling (src/archrev/hooks.py, src/archrev/cli.py
    hook command) must preserve fail-open behavior: hooks may never raise,
    block the editor on internal errors, or break git commits.

- id: audit-format-compat
  kind: prompt
  policy: >-
    Changes to session file formats (events.jsonl, meta.json, manifest.json)
    must remain readable for existing records and be reflected in the
    README storage section.

- id: tests-required
  kind: prompt
  policy: >-
    New or changed behavior in globmatch, rules, gate, storage, planning,
    drift, or trailer is covered by pytest before the session ends.
