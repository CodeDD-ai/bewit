# Test-matrix rules: one rule per enforcement kind/action, used by the
# live agent test in .test/README.md and the replay in .test/simulate.py.
#
# Path/read/check rules are scoped to .test/** so they never gate real
# work. Shell rules match marker strings only. The tool and MCP rules are
# repo-wide by nature (no path) but target tools this repo does not need.
# Disable the whole file with `enabled: false` on each rule, or delete it.

# --- Path rules (edit gate) -------------------------------------------------

- id: test-path-deny
  kind: path
  match: [".test/forbidden/**"]
  action: deny
  message: "TEST: edits under .test/forbidden are refused outright."

- id: test-path-block
  kind: path
  match: [".test/protected/**"]
  action: block
  message: "TEST: edits under .test/protected need explicit user approval."

- id: test-path-flag
  kind: path
  match: [".test/flagged/**"]
  action: flag
  message: "TEST: edits under .test/flagged are allowed but highlighted."

# --- Read rules ---------------------------------------------------------------

- id: test-read-flag
  kind: read
  match: [".test/flagged/**"]
  action: flag
  message: "TEST: reads under .test/flagged are recorded and highlighted."

# (.test/secrets/.env is covered by the existing no-secret-reads deny rule.)

# --- Shell rules (marker strings only) ------------------------------------------

- id: test-shell-deny
  kind: shell
  match_command: ["archrev-test-deny"]
  action: deny
  message: "TEST: commands containing archrev-test-deny are refused."

- id: test-shell-block
  kind: shell
  match_command: ["archrev-test-block"]
  action: block
  message: "TEST: commands containing archrev-test-block need approval."

- id: test-shell-flag
  kind: shell
  match_command: ["archrev-test-flag"]
  action: flag
  message: "TEST: commands containing archrev-test-flag are highlighted."

# --- Tool / MCP rules -------------------------------------------------------------

- id: test-tool-deny-notebook
  kind: tool
  match_tool: ["^NotebookEdit$"]
  action: deny
  message: "TEST: notebook editing is not allowed in this repository."

- id: test-mcp-flag-browser
  kind: mcp
  match_tool: ["^mcp__Claude_Browser__navigate$"]
  action: flag
  message: "TEST: browser navigation by the agent is recorded for review."

# --- Check rule (quality gate at session end) ----------------------------------------

- id: test-check-syntax
  kind: check
  match: [".test/check/**/*.py"]
  command: python -m archrev.syntaxcheck {files}
  action: block
  message: "TEST: Python under .test/check must parse."

# --- Prompt rule (attested in `archrev check plan`) --------------------------------------

- id: test-rules-scoped
  kind: prompt
  policy: >-
    Test-matrix rules stay scoped to .test/** (or to marker strings / tools
    this repository does not use), so they never gate real work.
