# Agent boundaries for the ArchRev repository: what agents may read,
# which shell commands need approval, and what gets recorded.
# Policy + audit at the tool layer - not a sandbox (see README).

- id: no-secret-reads
  kind: read
  match: ["dev-secrets/**", ".env", ".env.*", "**/*.pem", "**/*.key"]
  action: deny
  message: "Agents may not read secrets, keys, or environment files."

- id: protect-secret-files
  kind: path
  match: ["dev-secrets/**", ".env", ".env.*", "**/*.pem", "**/*.key"]
  action: block
  message: "Writing secrets, keys, or environment files requires explicit approval."

- id: push-needs-approval
  kind: shell
  match_command: ["\\bgit\\s+push\\b"]
  action: block
  message: "Pushing to a remote requires explicit approval."

- id: flag-dependency-installs
  kind: shell
  match_command: ["\\b(pip|pip3|uv pip|uv tool|npm|pnpm|yarn)\\s+(install|add)\\b"]
  action: flag
  message: "Dependency installation - recorded for review."

- id: flag-destructive-git
  kind: shell
  match_command: ["\\bgit\\s+(reset\\s+--hard|clean\\s+-[a-z]*f|push\\s+.*--force)"]
  action: block
  message: "Destructive git operation requires explicit approval."
