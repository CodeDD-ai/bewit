[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "archrev"
version = "0.5.0"
description = "Session provenance and architecture-rule enforcement for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ArchRev contributors" }]
keywords = [
    "cursor",
    "claude",
    "codex",
    "ai-agents",
    "provenance",
    "architecture",
    "governance",
    "code-review",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "cryptography>=42"]
seal = ["cryptography>=42"]

[project.scripts]
archrev = "archrev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archrev = ["report/template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
