<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchRev — session provenance</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #6ea8fe;
    --pass: #4cc38a; --flag: #f0b429; --block: #ef5350; --chip: #232936;
    --human: #b085f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  }
  code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    flex: none; z-index: 5;
  }
  header .logo { font-weight: 700; font-size: 16px; letter-spacing: .4px; }
  header .logo span { color: var(--accent); }
  header .root { color: var(--muted); font-size: 12px; }
  header .mode { margin-left: auto; }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600; background: var(--chip); color: var(--muted);
  }
  .badge.live { color: var(--pass); }
  .badge.export { color: var(--accent); }
  .badge.pass { color: var(--pass); }
  .badge.flag { color: var(--flag); }
  .badge.block { color: var(--block); }
  .badge.human { color: var(--human); }
  .badge.neutral { color: var(--muted); }
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px 1fr; }
  .layout.single { grid-template-columns: 1fr; }
  #sidebar, #main { min-height: 0; overflow-y: auto; }
  #sidebar { border-right: 1px solid var(--border); background: var(--panel); }
  .side-tools {
    display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 12px;
    border-bottom: 1px solid var(--border); position: sticky; top: 0;
    background: var(--panel); z-index: 1;
  }
  button.session-card {
    display: block; width: 100%; text-align: left; color: inherit; font: inherit;
    background: transparent; border: none; border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .session-card { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .session-card:hover { background: var(--panel-2); }
  .session-card.active { background: var(--panel-2); border-left: 3px solid var(--accent); padding-left: 11px; }
  .session-card .sid { color: var(--accent); }
  .session-card .when { color: var(--muted); font-size: 11px; }
  .session-card .excerpt { color: var(--text); font-size: 12.5px; margin: 4px 0; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .session-card .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  #main { padding: 16px 26px 48px; }
  h2.session-title { margin: 0 0 2px; font-size: 18px; font-weight: 650; }
  .session-id { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .tabs {
    display: flex; gap: 2px; position: sticky; top: 0; z-index: 3;
    background: var(--bg); border-bottom: 1px solid var(--border); margin: 8px 0 14px;
  }
  .tabs button {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 8px 12px; cursor: pointer; font: inherit;
  }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tabs button:hover { color: var(--text); }
  button.chip { font: inherit; color: inherit; cursor: pointer; }
  .chapter { border-bottom: 1px dashed var(--border); }
  button.chapter-head {
    display: flex; gap: 12px; align-items: baseline; width: 100%; text-align: left;
    background: transparent; color: inherit; font: inherit; border: none;
    padding: 10px 2px; cursor: pointer;
  }
  button.chapter-head:hover { background: var(--panel-2); }
  button.chapter-head .title {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chapter-body { padding: 0 4px 14px 8px; }
  .chapter-body .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .review-note {
    border-left: 3px solid var(--flag); padding: 4px 0 4px 10px; margin: 8px 0;
    color: var(--muted);
  }
  .file-batch { margin: 8px 0 4px; }
  .meta-line { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
  .meta-line b { color: var(--text); font-weight: 600; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 6px; }
  .chip { background: var(--chip); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 11px; font-size: 12px; }
  .chip b { font-weight: 600; }
  .chip.warn { border-color: var(--flag); }
  .chip.bad { border-color: var(--block); }
  .chip.good { border-color: var(--pass); }
  .chip.clickable { cursor: pointer; }
  .chip.clickable:hover { background: var(--panel-2); }
  .chip.selected { outline: 1px solid var(--accent); }
  #chip-detail {
    display: none; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; margin: 0 0 14px; font-size: 12.5px;
  }
  #chip-detail h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .6px; }
  #chip-detail ul { margin: 0; padding-left: 18px; }
  #chip-detail .hint { color: var(--muted); font-style: italic; }
  /* Toolbar: search + event filters */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input[type="search"] {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 7px 12px; font-size: 13px; width: 260px; outline: none;
  }
  .toolbar input[type="search"]:focus { border-color: var(--accent); }
  .filter-chip {
    background: var(--chip); border: 1px solid var(--border); border-radius: 14px;
    color: var(--muted); padding: 4px 12px; font-size: 12px; cursor: pointer; user-select: none;
  }
  .filter-chip.on { color: var(--text); border-color: var(--accent); background: #1d2a44; }
  section.card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 16px;
  }
  section.card h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase;
    letter-spacing: .8px; color: var(--muted); }
  section.card h3 .badge { text-transform: none; letter-spacing: 0; }
  .section-hint { color: var(--muted); font-size: 12px; margin: -6px 0 10px; }
  .prompt-text { white-space: pre-wrap; background: var(--panel-2); border-radius: 8px;
    padding: 10px 12px; margin: 6px 0; max-height: 240px; overflow-y: auto; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
  .plan-text { white-space: pre-wrap; background: var(--panel-2); border-radius: 8px;
    padding: 10px 12px; margin-top: 8px; max-height: 420px; overflow-y: auto; font-size: 12.5px; }
  .plan-progress { list-style: none; margin: 6px 0 0; padding: 0; columns: 2; column-gap: 24px; }
  .plan-progress li { padding: 2px 0; break-inside: avoid; font-size: 12.5px; }
  .plan-progress .tick { display: inline-block; width: 16px; }
  .plan-progress .done .tick { color: var(--pass); }
  .plan-progress .pending { color: var(--muted); }
  .plan-progress .pending .tick { color: var(--flag); }
  .revision { border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 8px; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline > li { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--border); flex-wrap: wrap; }
  .timeline > li:last-child { border-bottom: none; }
  .timeline .ts { color: var(--muted); font-size: 11px; white-space: nowrap; padding-top: 2px; width: 118px; }
  .timeline .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex: none; }
  .dot.prompt { background: var(--accent); }
  .dot.edit { background: #5c6b8a; }
  .dot.gate-ask, .dot.gate-deny { background: var(--block); }
  .dot.gate-flag { background: var(--flag); }
  .dot.check { background: var(--pass); }
  .dot.final { background: var(--flag); }
  .dot.plan { background: var(--human); }
  .dot.human { background: var(--human); }
  .timeline .body { flex: 1; min-width: 0; }
  .timeline .body .what { font-size: 13px; }
  .timeline .body .what.expandable { cursor: pointer; color: var(--accent); }
  .timeline .body .detail { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .timeline .inline-diff { flex-basis: 100%; margin-left: 152px; }
  .show-more {
    display: block; width: 100%; margin-top: 10px; padding: 8px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--accent); font-size: 12.5px; cursor: pointer;
  }
  .show-more:hover { background: var(--chip); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  td.loc { white-space: nowrap; }
  .add { color: var(--pass); } .del { color: var(--block); }
  tr.file-row { cursor: pointer; }
  tr.file-row:hover td { background: var(--panel-2); }
  tr.file-row td:first-child::before { content: "▸ "; color: var(--muted); }
  tr.file-row.open td:first-child::before { content: "▾ "; }
  tr.diff-row td { padding: 0; background: #12151b; }
  td.mono, .timeline .detail { overflow-wrap: anywhere; }
  pre.diff {
    margin: 0; padding: 10px 14px; max-height: 420px; overflow: auto;
    white-space: normal; overflow-wrap: anywhere;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; line-height: 1.45;
  }
  pre.diff .line { display: block; white-space: pre-wrap; }
  pre.diff .dl-add { color: var(--pass); background: rgba(76, 195, 138, .1); }
  pre.diff .dl-del { color: var(--block); background: rgba(239, 83, 80, .12); }
  pre.diff .dl-hunk { color: var(--accent); }
  pre.diff .dl-meta { color: var(--muted); }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    #sidebar { max-height: 34vh; border-right: none; border-bottom: 1px solid var(--border); }
    .chapter-body { padding-left: 8px; }
  }
  .empty { color: var(--muted); font-style: italic; }
  #error-banner {
    display: none; flex: none; background: #3a1f22; color: #ffb4ab; padding: 8px 18px;
    border-bottom: 1px solid var(--block); font-size: 13px;
  }
  #placeholder { color: var(--muted); padding: 60px; text-align: center; }
</style>
</head>
<body>
<script>/*__ARCHREV_EMBED__*/</script>
<header>
  <div class="logo">Arch<span>Rev</span></div>
  <div class="root mono" id="root-path"></div>
  <div class="mode"><span class="badge" id="mode-badge"></span></div>
</header>
<div id="error-banner"></div>
<div class="layout" id="layout">
  <nav id="sidebar"></nav>
  <main id="main"><div id="placeholder">Select a session</div></main>
</div>

<script>
"use strict";

const EXPORT = window.__ARCHREV_DATA__ || null;
const POLL_MS = 2500;
const FILTER_KINDS = ["prompt", "plan", "check", "gate", "edit", "human"];

let selectedId = null;
let currentView = null;
let lastRenderKey = "";
// UI state survives re-renders: search text, active kind filters, selected
// summary chip, expanded diff rows, timeline page count, fetched diffs.
const ui = {
  q: "", kinds: new Set(), chip: null, expanded: new Set(), diffs: new Map(),
  tab: "record", openChapters: new Set(), chapterCount: 0,
  side: "all", showOlder: false,
};

const $ = (id) => document.getElementById(id);

function esc(value) {
  const div = document.createElement("div");
  div.textContent = value == null ? "" : String(value);
  return div.innerHTML;
}

function shortId(id) { return id.length > 14 ? id.slice(0, 8) + "…" + id.slice(-4) : id; }

/** ISO UTC timestamp -> readable local time ("18 Sep 14:47:32"). */
function fmtTs(iso) {
  if (!iso) return "?";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getDate()} ${months[d.getMonth()]} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function locHtml(added, removed) {
  const a = Number.isInteger(added) ? `+${added}` : "+?";
  const r = Number.isInteger(removed) ? `-${removed}` : "-?";
  return `<span class="add">${a}</span>/<span class="del">${r}</span>`;
}

function badge(text, cls, title) {
  return `<span class="badge ${cls}" ${title ? `title="${esc(title)}"` : ""}>${esc(text)}</span>`;
}

function matchesSearch(...fields) {
  if (!ui.q) return true;
  const q = ui.q.toLowerCase();
  return fields.some((f) => String(f || "").toLowerCase().includes(q));
}

/* ---------------- sessions sidebar (live mode only) ---------------- */

function isReviewNote(text) {
  return String(text || "").startsWith("ArchRev final review found issues");
}

function isBookkeeping(path) {
  const normalized = String(path || "").replace(/\\/g, "/");
  return normalized.includes(".archrev/sessions/")
    || normalized.endsWith(".archrev/hook-errors.log");
}

function isOlderSession(id) {
  return id === "unknown" || String(id).startsWith("smoke");
}

function sessionVisible(session) {
  if (isOlderSession(session.id) && !ui.showOlder) return false;
  if (ui.side === "human") return session.id === "human";
  if (ui.side === "review")
    return (session.open_findings || 0) > 0 || (session.blocks || 0) > 0;
  return true;
}

let latestState = null;

function renderSidebar(state) {
  latestState = state;
  $("root-path").textContent = state.root || "";
  const visible = state.sessions.filter(sessionVisible);
  const older = state.sessions.filter((s) => isOlderSession(s.id)).length;
  const tools = `
    <div class="side-tools">
      <button type="button" class="filter-chip ${ui.side === "all" ? "on" : ""}" data-side="all">All</button>
      <button type="button" class="filter-chip ${ui.side === "review" ? "on" : ""}" data-side="review">Needs review</button>
      <button type="button" class="filter-chip ${ui.side === "human" ? "on" : ""}" data-side="human">Human</button>
      ${older ? `<button type="button" class="filter-chip ${ui.showOlder ? "on" : ""}" data-side="older">${ui.showOlder ? "Hide" : "Show"} older (${older})</button>` : ""}
    </div>`;
  const items = visible.map((s) => {
    const isHuman = s.id === "human";
    const badges = [];
    if (isHuman) badges.push(badge("human", "human"));
    else if (s.finalized) badges.push(badge("finalized", "neutral"));
    else badges.push(badge("in progress", "live"));
    if (s.open_findings) badges.push(badge(`${s.open_findings} open`, "block", "Findings the last final review still wants resolved."));
    if (s.plan_registered) badges.push(badge("plan", "pass"));
    if (s.checked) badges.push(badge("checked", "pass"));
    if (s.blocks) badges.push(badge(`${s.blocks} gated`, "block", "Edits or commands the gate paused or refused."));
    if (!isHuman) badges.push(badge(`${s.edits} edits`, "neutral"));
    const excerpt = isHuman
      ? "Files committed without an agent session"
      : (s.prompt_excerpt || "(no prompt captured)");
    return `
      <button type="button" class="session-card ${s.id === selectedId ? "active" : ""}" data-id="${esc(s.id)}">
        <div><span class="sid mono">${esc(shortId(s.id))}</span>
             <span class="when"> · ${esc(fmtTs(s.started_at))}</span></div>
        <div class="excerpt">${esc(excerpt)}</div>
        <div class="badges">${badges.join("")}</div>
      </button>`;
  });
  $("sidebar").innerHTML = tools + (items.join("") ||
    `<div id="placeholder">No sessions in this filter.</div>`);
  for (const el of document.querySelectorAll(".side-tools [data-side]")) {
    el.addEventListener("click", () => {
      if (el.dataset.side === "older") ui.showOlder = !ui.showOlder;
      else ui.side = el.dataset.side;
      renderSidebar(latestState);
    });
  }
  for (const el of document.querySelectorAll(".session-card")) {
    el.addEventListener("click", () => {
      if (selectedId !== el.dataset.id) {
        selectedId = el.dataset.id;
        ui.expanded.clear();
        ui.diffs.clear();
        ui.chip = null;
        ui.q = "";
        ui.openChapters = new Set();
        ui.chapterCount = 0;
        lastRenderKey = "";
        refreshSession();
      }
    });
  }
}

/* ---------------- summary chips (clickable drill-down) ---------------- */

function chipData(view) {
  // Each chip: id, label html, class, and the underlying items shown on click.
  const plan = view.plan || {};
  const drift = view.drift || {};
  const chips = [];
  if (view.id === "human") {
    chips.push({ id: "human-info", cls: "", label: "<b>Human changes ledger</b> — files committed without agent attribution", items: null });
    return chips;
  }
  if (!plan.registered) {
    chips.push({ id: "no-plan", cls: "warn", label: "<b>No plan registered</b> — drift not measurable", items: null });
  } else {
    chips.push({ id: "planned", cls: "", label: `planned <b>${(plan.declared_files || []).length}</b>`,
                 title: "Files the plan declares. Click to list them.",
                 items: plan.declared_files || [] });
    chips.push({ id: "touched", cls: "", label: `touched <b>${(view.files || []).length}</b>`,
                 title: "Files with recorded edit events. Click to list them.",
                 items: (view.files || []).map((f) => f.path) });
    const out = drift.out_of_plan || [];
    chips.push({ id: "out-of-plan", cls: out.length ? "warn" : "good",
                 label: `out-of-plan <b>${out.length}</b>`,
                 title: "Files touched but never declared in the plan - review whether they were intended.",
                 items: out });
    const unrealized = drift.unrealized || [];
    chips.push({ id: "unrealized", cls: unrealized.length ? "warn" : "good",
                 label: `unrealized <b>${unrealized.length}</b>`,
                 title: "Files the plan declared but no edit event touched (dropped scope, or changed via shell).",
                 items: unrealized });
  }
  const outside = view.outside_repo || [];
  if (outside.length)
    chips.push({ id: "outside-repo", cls: "warn",
                 label: `outside repo <b>${outside.length}</b>`,
                 title: "Files the session wrote outside this repository (other repos, editor-internal saves). Recorded for audit, excluded from plan drift.",
                 items: outside });
  const foreign = view.other_sessions || [];
  if (foreign.length)
    chips.push({ id: "other-sessions", cls: "",
                 label: `other sessions <b>${foreign.length}</b>`,
                 title: "Working-tree changes recorded as edits in a different session. Excluded from this session's drift and gate-bypass review.",
                 items: foreign.map((f) => `${f.path}  (${(f.sessions || []).join(", ")})`) });
  const background = (view.background_changes || []).filter((f) => !isBookkeeping(f.path));
  if (background.length)
    chips.push({ id: "background", cls: "",
                 label: `background <b>${background.length}</b>`,
                 title: "Working-tree changes made while none of this session's commands ran (hand edits, other windows, work that pre-dates the session). Excluded from this session's drift and gate-bypass review.",
                 items: background.map((f) => f.path) });
  const acked = new Set((view.acks || []).map((a) => String(a.target || "").toLowerCase()));
  const bypass = (view.protected_findings || []).filter(
    (f) => !f.via_gate && !acked.has(String(f.path || "").toLowerCase()));
  if (bypass.length)
    chips.push({ id: "bypass", cls: "bad",
                 label: `protected changes bypassing gate <b>${bypass.length}</b>`,
                 title: "Protected paths changed without passing the edit gate (shell or manual writes). Click to list.",
                 items: bypass.map((f) => `${f.path}  (${f.rule_id})`
                   + ((f.during || []).length ? `  during ${f.during.join("; ")}` : "")) });
  const quality = view.quality_checks || [];
  if (quality.length) {
    const latest = new Map();
    for (const q of quality) latest.set(q.rule_id, q);
    const failed = [...latest.values()].filter((q) => q.ok === false);
    chips.push({ id: "quality", cls: failed.length ? "bad" : "good",
                 label: `quality checks <b>${failed.length ? failed.length + " failed" : "passed"}</b>`,
                 title: "Check rules (semgrep/eslint/custom commands) run against the session's changed files. Click for details.",
                 items: [...latest.values()].map((q) =>
                   `${q.rule_id}: ${q.ok === true ? "passed" : q.ok === false ? "FAILED — " + (q.message || "") : "error — " + (q.error || "")}`) });
  }
  const acks = view.acks || [];
  if (acks.length)
    chips.push({ id: "acks", cls: "good", label: `acknowledged <b>${acks.length}</b>`,
                 title: "Findings resolved via archrev ack. Click to see who/why.",
                 items: acks.map((a) => `${a.target} — ${a.note || ""}`) });
  const chain = view.chain || null;
  if (chain)
    chips.push({ id: "chain", cls: chain.ok ? "good" : "bad",
                 label: `event chain <b>${chain.ok ? "intact" : "BROKEN"}</b>`,
                 title: "Hash-chain verification of the event log (tamper evidence). Run `archrev verify` in CI for the same check.",
                 items: [chain.ok
                   ? `${chain.checked} event(s) verified${chain.legacy ? `, ${chain.legacy} pre-chain legacy event(s)` : ""}`
                   : `Chain breaks at event #${chain.break_at} — the log was modified after the fact.`] });
  return chips;
}

function renderChipDetail(view) {
  const panel = $("chip-detail");
  const chip = chipData(view).find((c) => c.id === ui.chip);
  if (!chip || chip.items === null) { panel.style.display = "none"; return; }
  const title = chip.title ? `<div class="hint">${esc(chip.title)}</div>` : "";
  const list = chip.items.length
    ? `<ul>${chip.items.map((i) => `<li class="mono">${esc(i)}</li>`).join("")}</ul>`
    : `<div class="hint">nothing here — that is the good outcome</div>`;
  panel.innerHTML = `<h4>${chip.id.replace(/-/g, " ")}</h4>${title}${list}`;
  panel.style.display = "block";
}

/* ---------------- timeline ---------------- */

function uniquePromptEntries(view) {
  const out = [];
  (view.prompts || []).forEach((p, i) => {
    const prev = out[out.length - 1];
    if (prev && prev.p.ts === p.ts && (prev.p.text || "") === (p.text || "")) return;
    out.push({ p, i });
  });
  return out;
}

function headingText(view) {
  if (view.id === "human") return "Human changes";
  const prompts = (view.prompts || []).filter(
    (p) => !isReviewNote(p.text) && String(p.text || "").trim());
  if (prompts.length)
    return prompts[prompts.length - 1].text.trim().split("\n")[0].slice(0, 110);
  if ((view.prompts || []).some((p) => p.sealed)) return "Sealed prompt";
  return "No prompt captured";
}

function collectEvents(view) {
  const items = [];
  (view.prompts || []).forEach((p, index) => {
    const review = isReviewNote(p.text);
    items.push({
      ts: p.ts, kind: review ? "final" : "prompt", cat: "prompt", review,
      promptIndex: index, text: p.text || "", sealed: !!p.sealed,
      what: review ? "ArchRev review note" : "Prompt",
      detail: p.sealed && !p.text ? "(sealed)" : (p.text || ""),
    });
  });
  for (const r of (view.plan || {}).revisions || [])
    items.push({ ts: r.ts, kind: "plan", cat: "plan", what: "Plan registered",
                 detail: `${(r.declared_files || []).length} file(s) declared`,
                 files: r.declared_files || [] });
  for (const c of view.checks || [])
    items.push({ ts: c.ts, kind: "check", cat: "check",
                 what: `Plan check — ${c.ok ? "passed" : "not passed"}`,
                 detail: (c.prompt_rules || []).map((r) => `${r.rule_id}: ${r.verdict}`).join(", ") });
  for (const f of view.final_checks || [])
    items.push({ ts: f.ts, kind: (f.findings || []).length ? "final" : "check", cat: "check",
                 what: (f.findings || []).length
                   ? `Final review — ${f.findings.length} finding(s)`
                   : "Final review — clean",
                 detail: (f.findings || []).join(" | ") });
  for (const a of view.acks || [])
    items.push({ ts: a.ts, kind: "check", cat: "check",
                 what: `Acknowledged ${a.target || ""}`, detail: a.note || "" });
  for (const q of view.quality_checks || []) {
    const status = q.ok === true ? "passed" : q.ok === false ? "FAILED" : "could not run";
    items.push({ ts: q.ts, kind: q.ok === false ? "final" : "check", cat: "check",
                 what: `Quality check ${q.rule_id} — ${status}`,
                 detail: q.ok === false ? (q.message || "") : `${(q.files || []).length} file(s)` });
  }
  for (const h of view.human_changes || [])
    items.push({ ts: h.ts, kind: "human", cat: "human",
                 what: `Human commit (${(h.files || []).length} file(s))`,
                 detail: (h.files || []).filter((p) => !isBookkeeping(p)).join(", ") });
  for (const g of view.gate_events || []) {
    const kind = g.permission === "allow" ? "gate-flag" : `gate-${g.permission}`;
    const subject = { edit: "Edit", shell: "Shell command", read: "File read",
                      mcp: "MCP call", tool: "Tool call" }[g.kind] || "Edit";
    const what = g.permission === "allow" ? `${subject} flagged` :
                 g.permission === "ask" ? `${subject} paused for approval` :
                 `${subject} denied`;
    const where = (g.paths && g.paths.length) ? g.paths.join(", ") : (g.target || "");
    items.push({ ts: g.ts, kind, cat: "gate", what,
                 detail: where + ((g.hits || []).length
                   ? "  [" + (g.hits || []).map((h) => `${h.action}:${h.rule_id}`).join(", ") + "]"
                   : "") });
  }
  for (const e of view.edits || []) {
    if (isBookkeeping(e.path)) continue;
    items.push({ ts: e.ts, kind: "edit", cat: "edit",
                 what: e.origin === "tab" ? "File edited (tab)" : "File edited",
                 detail: e.path, diffPath: e.path });
  }
  items.sort((a, b) => String(a.ts || "").localeCompare(String(b.ts || "")));
  return items;
}

function coalesceEdits(events) {
  const out = [];
  let batch = null;
  const flush = () => { if (batch) { out.push(batch); batch = null; } };
  for (const event of events) {
    if (event.cat === "edit") {
      if (!batch) batch = { ts: event.ts, cat: "edit", kind: "edit", what: "Files changed", files: [] };
      const prior = batch.files.find((f) => f.path === event.diffPath);
      if (prior) prior.count += 1;
      else batch.files.push({ path: event.diffPath, count: 1 });
    } else {
      flush();
      out.push(event);
    }
  }
  flush();
  return out;
}

function buildChapters(view) {
  const events = [];
  for (const event of collectEvents(view)) {
    const prev = events[events.length - 1];
    // Hooks have recorded the same submission twice. One chapter is enough.
    if (prev && event.cat === "prompt" && prev.cat === "prompt"
        && event.ts === prev.ts && event.text === prev.text) continue;
    events.push(event);
  }
  const chapters = [];
  let current = null;
  for (const event of events) {
    if (event.cat === "prompt" && !event.review) {
      if (current) chapters.push(current);
      const line = (event.text || "Prompt").trim().split("\n")[0].slice(0, 140) || "Prompt";
      current = { title: line, ts: event.ts, prompt: event, events: [] };
    } else if (!current) {
      current = {
        title: view.id === "human" ? "Human changes" : "Before the first prompt",
        ts: event.ts || view.started_at, prompt: null, events: [event],
      };
    } else {
      current.events.push(event);
    }
  }
  if (current) chapters.push(current);
  if (!chapters.length)
    chapters.push({
      title: view.id === "human" ? "Human changes" : "Nothing recorded yet",
      ts: view.started_at, prompt: null, events: [],
    });
  for (const chapter of chapters) chapter.events = coalesceEdits(chapter.events);
  return chapters;
}

function eventVisible(event) {
  const files = (event.files || []).map((f) => f.path).join(" ");
  const catOk = ui.kinds.size === 0 || ui.kinds.has(event.cat);
  return catOk && matchesSearch(event.what, event.detail, event.text, files);
}

/* ---------------- diffs ---------------- */

function renderDiffText(text) {
  return text.split("\n").map((line) => {
    let cls = "line";
    if (line.startsWith("@@")) cls += " dl-hunk";
    else if (line.startsWith("diff ") || line.startsWith("index ") || line.startsWith("---") || line.startsWith("+++"))
      cls += " dl-meta";
    else if (line.startsWith("+")) cls += " dl-add";
    else if (line.startsWith("-")) cls += " dl-del";
    return `<div class="${cls}">${esc(line) || " "}</div>`;
  }).join("");
}

async function loadDiff(path) {
  if (ui.diffs.has(path)) return ui.diffs.get(path);
  let text;
  if (EXPORT) {
    text = (EXPORT.diffs || {})[path] || "(diff not embedded in this export)";
  } else {
    try {
      const res = await fetch(`/api/diff?session=${encodeURIComponent(selectedId)}&path=${encodeURIComponent(path)}`);
      text = (await res.json()).diff || "(no diff available)";
    } catch { text = "(viewer unreachable)"; }
  }
  ui.diffs.set(path, text);
  return text;
}

async function toggleDiff(row, path, forceOpen) {
  const open = row.classList.contains("open");
  if (open && !forceOpen) {
    row.classList.remove("open");
    ui.expanded.delete(path);
    const next = row.nextElementSibling;
    if (next && next.classList.contains("diff-row")) next.remove();
    return;
  }
  if (open) return;
  row.classList.add("open");
  ui.expanded.add(path);
  const diffRow = document.createElement("tr");
  diffRow.className = "diff-row";
  diffRow.innerHTML = `<td colspan="3"><pre class="diff">loading…</pre></td>`;
  row.after(diffRow);
  const text = await loadDiff(path);
  diffRow.querySelector("pre").innerHTML = renderDiffText(text);
  diffRow.scrollIntoView({ block: "nearest" });
}

async function toggleInlineDiff(li, path) {
  const existing = li.querySelector(".inline-diff");
  if (existing) { existing.remove(); return; }
  const holder = document.createElement("div");
  holder.className = "inline-diff";
  holder.innerHTML = `<pre class="diff">loading…</pre>`;
  li.appendChild(holder);
  const text = await loadDiff(path);
  holder.querySelector("pre").innerHTML = renderDiffText(text);
}

/* ---------------- session detail ---------------- */

function filterChipHtml() {
  return FILTER_KINDS.map((k) =>
    `<button type="button" class="filter-chip ${ui.kinds.has(k) ? "on" : ""}" data-kind="${k}">${k}</button>`
  ).join("");
}

function fileNotes(view, f) {
  // Rule chips carry the rule message as tooltip, plus what actually
  // happened at the gate for this file (paused / flagged / denied counts).
  const notes = [];
  if (f.untracked) notes.push(badge("new", "neutral", "New file (untracked at session start)."));
  if (view.plan && view.plan.registered && !f.in_plan)
    notes.push(badge("out-of-plan", "flag", "Touched but not declared in the plan."));
  for (const r of f.rules || []) {
    const explain = { block: "will pause for approval when edited",
                      flag: "recorded and highlighted when edited",
                      deny: "edit refused outright" }[r.action] || "";
    notes.push(badge(`${r.action}: ${r.rule_id}`, r.action === "flag" ? "flag" : "block",
                     `${r.message || ""} (${explain})`));
  }
  const lower = (f.path || "").toLowerCase();
  let paused = 0, flagged = 0, denied = 0;
  for (const g of view.gate_events || []) {
    if (!(g.paths || []).some((p) => String(p).toLowerCase() === lower)) continue;
    if (g.permission === "ask") paused += 1;
    else if (g.permission === "deny") denied += 1;
    else if ((g.hits || []).length) flagged += 1;
  }
  if (denied) notes.push(badge(`denied ×${denied}`, "block", "The gate refused edit attempts on this file."));
  if (paused) notes.push(badge(`paused ×${paused}`, "block",
    "The gate answered 'ask'; whether it was shown depends on your Cursor approval settings."));
  if (flagged) notes.push(badge(`flagged ×${flagged}`, "flag", "Edits allowed but recorded for review."));
  return notes;
}

function renderSession(view) {
  currentView = view;
  const chapters = buildChapters(view);
  if (chapters.length !== ui.chapterCount) {
    ui.openChapters.add(String(chapters.length - 1));
    ui.chapterCount = chapters.length;
  }
  const userPrompts = uniquePromptEntries(view).filter(({ p }) => !isReviewNote(p.text)).length;
  const lists = visibleFileLists(view);
  const fileCount = lists.files.length + lists.other.length
    + lists.foreign.length + lists.background.length;
  const sealed = (view.prompts || []).some((p) => p.sealed);

  $("main").innerHTML = `
    <div class="session-id mono">${esc(view.id)}</div>
    <h2 class="session-title">${esc(headingText(view))}</h2>
    <div class="meta-line">
      started <b>${esc(fmtTs(view.started_at))}</b> ·
      ${view.id === "human" ? "ledger" : view.finalized ? "finalized" : "in progress"}
      ${view.runtime ? ` · ${esc(view.runtime)}` : ""}
      ${view.branch ? ` · branch <b class="mono">${esc(view.branch)}</b>` : ""} ·
      base <span class="mono">${esc((view.head_sha || "").slice(0, 10) || "—")}</span>
    </div>
    <div class="chips">${chipData(view).map((c) => `
      <button type="button" class="chip ${c.cls} ${c.items !== null ? "clickable" : ""} ${ui.chip === c.id ? "selected" : ""}"
           data-chip="${c.id}" ${c.title ? `title="${esc(c.title)}"` : ""}>${c.label}</button>`).join("")}
    </div>
    <div id="chip-detail"></div>
    ${sealed ? `<form id="unseal-form" class="toolbar">
      <input type="password" id="unseal-pass" placeholder="Seal passphrase (empty if the key is unprotected)" autocomplete="off">
      <button type="submit">Unseal prompts</button>
      <span class="hint">Decrypted in this tab only. Nothing is written back.</span>
    </form>` : ""}
    <nav class="tabs">
      ${tabButton("record", "Record", chapters.length)}
      ${tabButton("prompts", "Prompts", userPrompts)}
      ${tabButton("files", "Files", fileCount)}
      ${tabButton("plan", "Plan", (view.plan || {}).registered ? ((view.plan || {}).revisions || []).length : 0)}
      ${tabButton("rules", "Rules", (view.checks || []).length)}
    </nav>
    <div class="toolbar">
      <input type="search" id="search-box" placeholder="Search this section…" value="${esc(ui.q)}">
      ${ui.tab === "record" ? filterChipHtml() : ""}
    </div>
    <section class="card">${panelHtml(view, chapters)}</section>`;

  for (const chip of document.querySelectorAll("#main .chip.clickable")) {
    chip.addEventListener("click", () => {
      ui.chip = ui.chip === chip.dataset.chip ? null : chip.dataset.chip;
      renderSession(currentView);
    });
  }
  renderChipDetail(view);

  for (const tab of document.querySelectorAll("#main .tabs button")) {
    tab.addEventListener("click", () => {
      ui.tab = tab.dataset.tab;
      renderSession(currentView);
    });
  }
  for (const head of document.querySelectorAll(".chapter-head")) {
    head.addEventListener("click", () => {
      const key = head.dataset.chapter;
      if (ui.openChapters.has(key)) ui.openChapters.delete(key);
      else ui.openChapters.add(key);
      renderSession(currentView);
    });
  }

  const unseal = $("unseal-form");
  if (unseal) unseal.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const res = await fetch("/api/unseal", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session: view.id,
        passphrase: ($("unseal-pass") || {}).value || "",
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error || "Could not unseal prompts.");
      return;
    }
    for (const item of data.prompts || []) {
      const node = document.querySelector(`.prompt-text[data-prompt="${item.index}"]`);
      if (node) node.textContent = item.text;
    }
  });

  const search = $("search-box");
  search.addEventListener("input", () => {
    ui.q = search.value;
    const pos = search.selectionStart;
    renderSession(currentView);
    const again = $("search-box");
    again.focus();
    again.setSelectionRange(pos, pos);
  });
  for (const chip of document.querySelectorAll("#main .filter-chip")) {
    chip.addEventListener("click", () => {
      const kind = chip.dataset.kind;
      if (ui.kinds.has(kind)) ui.kinds.delete(kind); else ui.kinds.add(kind);
      renderSession(currentView);
    });
  }
  for (const row of document.querySelectorAll("tr.file-row")) {
    const path = row.dataset.path;
    const toggle = () => toggleDiff(row, path, false);
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
    });
    if (ui.expanded.has(path)) toggleDiff(row, path, true);
  }
}

function tabButton(id, label, count) {
  return `<button type="button" class="${ui.tab === id ? "on" : ""}" data-tab="${id}">${label}${count ? ` <b>${count}</b>` : ""}</button>`;
}

function visibleFileLists(view) {
  const keep = (f) => !isBookkeeping(f.path) && matchesSearch(f.path, (f.sessions || []).join(" "));
  return {
    files: (view.files || []).filter(keep),
    other: (view.other_changes || []).filter(keep),
    foreign: (view.other_sessions || []).filter(keep),
    background: (view.background_changes || []).filter(keep),
  };
}

function panelHtml(view, chapters) {
  if (ui.tab === "prompts") return promptsPanel(view);
  if (ui.tab === "files") return filesPanel(view);
  if (ui.tab === "plan") return planPanel(view);
  if (ui.tab === "rules") return rulesPanel(view);
  return recordPanel(view, chapters);
}

function recordPanel(view, chapters) {
  const html = chapters.map((chapter, index) => {
    const events = chapter.events.filter(eventVisible);
    const headHit = matchesSearch(chapter.title, chapter.prompt && chapter.prompt.text);
    const prompted = !ui.kinds.size || ui.kinds.has("prompt");
    if ((ui.q || ui.kinds.size) && !headHit && !events.length) return "";
    if (ui.kinds.size && !events.length && !(prompted && headHit && chapter.prompt)) return "";
    const key = String(index);
    const open = ui.q ? true : ui.openChapters.has(key);
    const bodyEvents = ui.kinds.size ? events : (ui.q && !headHit ? events : chapter.events);
    const fileCount = bodyEvents.filter((e) => e.cat === "edit")
      .reduce((n, e) => n + e.files.length, 0);
    return `<article class="chapter">
      <button type="button" class="chapter-head" data-chapter="${key}">
        <span class="ts mono">${esc(fmtTs(chapter.ts))}</span>
        <span class="title">${esc(chapter.title)}</span>
        <span class="when">${fileCount ? fileCount + " files" : ""} ${open ? "▾" : "▸"}</span>
      </button>
      ${open ? `<div class="chapter-body">${chapterBody(chapter, bodyEvents)}</div>` : ""}
    </article>`;
  }).join("");
  return html || "<p class='empty'>Nothing in this record matches.</p>";
}

function chapterBody(chapter, events) {
  const prompt = chapter.prompt
    ? `<div class="prompt-text" data-prompt="${chapter.prompt.promptIndex}">${esc(chapter.prompt.text) || (chapter.prompt.sealed ? "(sealed)" : "(empty)")}</div>`
    : "";
  const rest = events.map((event) => {
    if (event.cat === "edit") {
      const rows = event.files.map((f) =>
        `<tr class="file-row" tabindex="0" role="button" data-path="${esc(f.path)}">
          <td class="mono">${esc(f.path)}${f.count > 1 ? ` <span class="when">×${f.count}</span>` : ""}</td>
          <td></td><td></td></tr>`).join("");
      return `<div class="file-batch"><div class="what">Files changed <b>${event.files.length}</b></div>
        <table><tbody>${rows}</tbody></table></div>`;
    }
    return `<div class="${event.review ? "review-note" : ""}">
      <span class="dot ${event.kind}"></span> <b>${esc(event.what)}</b>
      <span class="when">${esc(fmtTs(event.ts))}</span>
      ${event.detail ? `<div class="detail mono">${esc(String(event.detail).slice(0, 700))}</div>` : ""}
    </div>`;
  }).join("");
  return prompt + (rest || "<p class='empty'>No further events in this stretch.</p>");
}

function promptsPanel(view) {
  const prompts = uniquePromptEntries(view).reverse()
    .filter(({ p }) => matchesSearch(p.text, fmtTs(p.ts)));
  if (!prompts.length) return "<p class='empty'>No prompt captured.</p>";
  const newestUser = prompts.find(({ p }) => !isReviewNote(p.text));
  return prompts.map(({ p, i }) => {
    const review = isReviewNote(p.text);
    const title = review
      ? "ArchRev review note"
      : (p.text || (p.sealed ? "(sealed)" : "(empty)")).trim().split("\n")[0].slice(0, 120);
    const open = newestUser && newestUser.i === i ? "open" : "";
    return `<details ${open} class="${review ? "review-note" : ""}">
      <summary>${esc(fmtTs(p.ts))} — ${esc(title)}</summary>
      <div class="prompt-text" data-prompt="${i}">${esc(p.text) || (p.sealed ? "(sealed)" : "(empty)")}</div>
    </details>`;
  }).join("");
}

function filesPanel(view) {
  const { files, other, foreign, background } = visibleFileLists(view);
  const row = (f, notes) =>
    `<tr class="file-row" tabindex="0" role="button" data-path="${esc(f.path)}">
      <td class="mono">${esc(f.path)}</td>
      <td class="loc">${locHtml(f.added, f.removed)}</td><td>${notes}</td></tr>`;
  const rows = [
    ...files.map((f) => row(f, fileNotes(view, f).join(" ") || "—")),
    ...other.map((f) => row(f, badge("outside tracked edits", "neutral",
      (f.during || []).length
        ? `Changed with no edit event while this session ran: ${f.during.join("; ")}`
        : "In the working tree with no edit event in this session."))),
    ...foreign.map((f) => row(f, badge(`other session`, "neutral", (f.sessions || []).join(", ")))),
    ...background.map((f) => row(f, badge("background", "neutral",
      "Changed while none of this session's commands ran (hand edit, another window, or pre-existing)."))),
  ];
  if (!rows.length) return "<p class='empty'>No file changes to show.</p>";
  return `<p class="section-hint">Click a row for the diff since the session started. Session bookkeeping is hidden.</p>
    <table><thead><tr><th>File</th><th>LOC</th><th>Notes</th></tr></thead>
    <tbody>${rows.join("")}</tbody></table>`;
}

function planPanel(view) {
  const plan = view.plan || {};
  if (!plan.registered)
    return "<p class='empty'>No plan registered. Drift against a plan cannot be measured.</p>";
  const progress = plan.progress || [];
  const revisions = plan.revisions || [];
  const done = progress.filter((p) => p.touched).length;
  const revHtml = revisions.map((revision, i) => {
    const previous = new Set((i ? revisions[i - 1].declared_files || [] : []).map((p) => p.toLowerCase()));
    const current = revision.declared_files || [];
    const currentSet = new Set(current.map((p) => p.toLowerCase()));
    const added = current.filter((p) => !previous.has(p.toLowerCase()));
    const removed = (i ? revisions[i - 1].declared_files || [] : []).filter((p) => !currentSet.has(p.toLowerCase()));
    const delta = [added.length ? `+${added.length}` : "", removed.length ? `−${removed.length}` : ""].filter(Boolean).join(" ");
    return `<div class="revision"><details ${i === revisions.length - 1 ? "open" : ""}>
      <summary>revision ${i + 1} of ${revisions.length} — ${esc(fmtTs(revision.ts))}
        · ${current.length} files${delta ? ` · ${esc(delta)}` : ""}</summary>
      ${added.length ? `<div class="section-hint">Added ${added.map((p) => `<span class="mono">${esc(p)}</span>`).join(", ")}</div>` : ""}
      ${removed.length ? `<div class="section-hint">Dropped ${removed.map((p) => `<span class="mono">${esc(p)}</span>`).join(", ")}</div>` : ""}
      <div class="plan-text">${esc(revision.text || "(text not captured — registered before v0.2)")}</div>
    </details></div>`;
  }).join("");
  return `<div class="section-hint">${done}/${progress.length} declared files touched · ${revisions.length} revision(s). Each line is the change from the previous registration.</div>
    <ul class="plan-progress">${progress.map((p) => `<li class="${p.touched ? "done" : "pending"}">
      <span class="tick">${p.touched ? "✓" : "○"}</span><span class="mono">${esc(p.path)}</span></li>`).join("")}</ul>
    ${revHtml}`;
}

function rulesPanel(view) {
  const checks = (view.checks || []).map((c) => {
    const attests = (c.prompt_rules || []).map((r) => {
      const cls = r.verdict === "pass" ? "pass" : r.verdict === "fail" ? "block" : "flag";
      return `<li>${badge(r.verdict, cls)} <b>${esc(r.rule_id)}</b> — ${esc(r.policy)}</li>`;
    }).join("");
    return `<p><b>${esc(fmtTs(c.ts))}</b> — ${c.ok ? badge("passed", "pass") : badge("not passed", "block")}</p>
      ${attests ? `<ul>${attests}</ul>` : "<p class='empty'>No prompt rules on this check.</p>"}`;
  }).join("");
  const quality = (view.quality_checks || []).map((q) => {
    const status = q.ok === true ? "passed" : q.ok === false ? "FAILED" : "could not run";
    return `<li>${esc(q.rule_id)} — ${esc(status)}</li>`;
  }).join("");
  const acks = (view.acks || []).map((a) =>
    `<li><span class="mono">${esc(a.target)}</span> — ${esc(a.note || "")}</li>`).join("");
  const commits = (view.commits || []).map((c) =>
    `<li><span class="mono">${esc((c.sha || "").slice(0, 10))}</span> ${esc(c.subject)}
     <span class="when">(${esc(c.date || "")})</span></li>`).join("");
  if (!checks && !quality && !acks && !commits)
    return "<p class='empty'>No plan check, quality result, acknowledgment, or linked commit.</p>";
  return `
    ${checks ? `<h3>Plan checks</h3>${checks}` : ""}
    ${quality ? `<h3>Quality checks</h3><ul>${quality}</ul>` : ""}
    ${acks ? `<h3>Acknowledgments</h3><ul>${acks}</ul>` : ""}
    ${commits ? `<h3>Commits</h3><ul>${commits}</ul>` : ""}`;
}
/* ---------------- data flow ---------------- */

function showError(message) {
  const banner = $("error-banner");
  banner.style.display = message ? "block" : "none";
  banner.textContent = message || "";
}

function viewRenderKey(view) {
  // Re-render only when the underlying data changed, so typing in the
  // search box is never interrupted by the poll cycle.
  const loc = (view.files || []).reduce((n, f) => n + (f.added || 0) + (f.removed || 0), 0);
  return [view.id, view.event_count, view.finalized, loc,
          (view.commits || []).length, (view.other_changes || []).length,
          (view.background_changes || []).length].join("|");
}

async function refreshState() {
  try {
    const res = await fetch("/api/state");
    const state = await res.json();
    showError("");
    renderSidebar(state);
    if (!selectedId && state.sessions.length) {
      selectedId = state.sessions[0].id;
      refreshSession();
    }
  } catch {
    showError("Cannot reach archrev serve — is it still running?");
  }
}

async function refreshSession() {
  if (!selectedId) return;
  try {
    const res = await fetch("/api/session/" + encodeURIComponent(selectedId));
    if (!res.ok) return;
    const view = await res.json();
    const key = viewRenderKey(view);
    if (key !== lastRenderKey) {
      lastRenderKey = key;
      ui.diffs.clear(); // data changed; cached diffs may be stale
      renderSession(view);
    }
  } catch { /* transient; state poll reports connectivity */ }
}

if (EXPORT) {
  $("mode-badge").textContent = "exported report";
  $("mode-badge").classList.add("export");
  $("root-path").textContent = EXPORT.root || "";
  $("layout").classList.add("single");
  $("sidebar").remove();
  renderSession(EXPORT.session);
} else {
  $("mode-badge").textContent = "watching";
  $("mode-badge").title = "This page refreshes every few seconds. Capture does not depend on it.";
  $("mode-badge").classList.add("live");
  refreshState();
  setInterval(refreshState, POLL_MS);
  setInterval(refreshSession, POLL_MS);
}
</script>
</body>
</html>
